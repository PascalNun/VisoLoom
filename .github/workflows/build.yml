name: Build and tests
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test engine control process without ML packages or weights
        shell: pwsh
        run: |
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          & $python -m unittest discover -s tests/engine -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - run: dotnet restore VisoLoom.sln --locked-mode
      - run: dotnet build VisoLoom.sln --no-restore --configuration Release
      - name: Compile the isolated native inspection fixture
        shell: pwsh
        run: |
          $packageRoot = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path ([Environment]::GetFolderPath('UserProfile')) '.nuget/packages' }
          $rhinoSdk = Join-Path $packageRoot 'rhinocommon/8.0.23304.9001/lib/net48'
          dotnet restore tests/native/ImageInspectionCheck.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/native/ImageInspectionCheck.csproj --no-restore --configuration Release "-p:RhinoSdkDirectory=$rhinoSdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet test VisoLoom.sln --no-build --configuration Release --logger trx
      - name: Check Mac test launcher syntax
        if: runner.os == 'macOS'
        run: bash -n "Test VisoLoom.command"
      - name: Check plug-in deployment boundary
        shell: pwsh
        run: |
          $files = Get-ChildItem src/VisoLoom.Plugin/bin/Release/net7.0 -Recurse -File
          $forbidden = $files | Where-Object { $_.Name -match '^(RhinoCommon|Rhino.UI|Eto|Ed.Eto|System.Drawing.Common|Microsoft.Win32.SystemEvents)\.' }
          if ($forbidden) { throw 'Host runtime assemblies must not be shipped.' }
          if (Test-Path LICENSE) { throw 'Project licensing remains undecided.' }
